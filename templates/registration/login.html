{% extends "base_page.html" %}

{% block page-title %}
Вход
{% endblock %}

{% block page-lead %}
Это страничка проекта для входа пользователя.
{% endblock %}

{% block content %}
<h2>Вход</h2>
    <p><a href="{% url 'social:begin' 'github' %}">Войти через GitHub</a></p>
    <p><a href="{% url 'social:begin' 'google-oauth2' %}">Войти через Google</a></p>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Войти</button>
</form>
<a href="{% url 'signup' %}">Нет аккаунта?</a>
{% endblock %}
